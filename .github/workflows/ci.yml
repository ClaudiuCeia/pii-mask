name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality and npm package checks
        run: bun run prepublishOnly

      - name: Audit dependencies
        run: bun audit --audit-level high

  runtime-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun-version: 1.3.0
            node-version: 24
          - bun-version: 1.4.2
            node-version: 25
          - bun-version: 1.4.2
            node-version: 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify installed npm package
        run: bun run package:smoke

  jsr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        deno-version: [v2.9.0, v2.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package versions
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          deno_version="$(bun -e 'console.log(require("./deno.json").version)')"
          test "${package_version}" = "${deno_version}"

      - name: Verify Deno package runtime
        run: bun run jsr:smoke

      - name: Verify JSR package
        run: deno publish --dry-run

  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCHMARK_THRESHOLD_PERCENT: 15

    steps:
      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install baseline dependencies
        run: bun install --frozen-lockfile
        working-directory: baseline

      - name: Install candidate dependencies
        run: bun install --frozen-lockfile
        working-directory: candidate

      - name: Build baseline
        run: bun run build
        working-directory: baseline

      - name: Build candidate
        run: bun run build
        working-directory: candidate

      - name: Benchmark baseline
        run: >-
          bun candidate/scripts/benchmark.ts
          --module baseline/dist/index.js
          --json baseline-results.json

      - name: Benchmark candidate
        run: >-
          bun candidate/scripts/benchmark.ts
          --module candidate/dist/index.js
          --json candidate-results.json

      - name: Enforce performance budget
        run: >-
          bun candidate/scripts/compare-benchmarks.ts
          baseline-results.json
          candidate-results.json
