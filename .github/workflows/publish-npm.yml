name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' is not a stable semantic version."
            exit 1
          fi
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          deno_version="$(bun -e 'console.log(require("./deno.json").version)')"
          if [[ "${package_version}" != "${deno_version}" ]]; then
            echo "package.json version '${package_version}' does not match deno.json version '${deno_version}'."
            exit 1
          fi
          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Tag '${tag}' does not match package version '${package_version}'."
            exit 1
          fi

      - name: Run checks
        run: bun run check

      - name: Verify Deno package runtime
        run: bun run jsr:smoke

      - name: Verify JSR package
        run: deno publish --dry-run

      - name: Verify npm package
        run: bun run package:check

  publish-jsr:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          resolved="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          test "${resolved}" = "${GITHUB_SHA}"

      - name: Check whether JSR version exists
        id: jsr_version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          bun scripts/verify-published-version.ts jsr "${version}" "${GITHUB_SHA}" "${GITHUB_REF}"

      - name: Publish to JSR
        if: steps.jsr_version.outputs.exists != 'true'
        run: deno publish

      - name: Verify published JSR provenance
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for attempt in 1 2 3 4 5 6; do
            echo "JSR provenance verification attempt ${attempt}/6"
            if bun scripts/verify-published-version.ts jsr "${version}" "${GITHUB_SHA}" "${GITHUB_REF}" --require; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify published JSR package runtime
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for attempt in 1 2 3 4 5 6; do
            echo "JSR runtime verification attempt ${attempt}/6"
            if deno run --allow-env --allow-sys=hostname --no-lock --min-dep-age=0 scripts/jsr-consumer-smoke.ts "${version}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-npm:
    runs-on: ubuntu-latest
    needs: publish-jsr
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          resolved="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          test "${resolved}" = "${GITHUB_SHA}"

      - name: Check whether npm version exists
        id: npm_version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          bun scripts/verify-published-version.ts npm "${version}" "${GITHUB_SHA}" "${GITHUB_REF}"

      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Verify published npm provenance
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for attempt in 1 2 3 4 5 6; do
            echo "npm provenance verification attempt ${attempt}/6"
            if bun scripts/verify-published-version.ts npm "${version}" "${GITHUB_SHA}" "${GITHUB_REF}" --require; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-jsr, publish-npm]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          resolved="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          test "${resolved}" = "${GITHUB_SHA}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
